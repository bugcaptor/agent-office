[package]
name = "agent-office"
version = "0.7.1"
description = "Agent Office"
authors = ["bugcaptor"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agent_office_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
# macos-private-api: 마스코트 창(이슈 #72)의 투명 배경에 필수. tauri.conf.json의
# `app.macOSPrivateApi`만 켜면 빌드가 실패한다 — 이 feature와 짝이다. macOS가
# 아닌 타깃에서는 no-op.
tauri = { version = "2", features = [
    "macos-private-api",
] } # Channel/이벤트/경로 API 포함
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9" # 사용자 Codex config.toml 읽기(업무 수신함 writable_roots 합치기)
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "time",
    "sync",
    "process",
    "io-util",
    "signal",
] }
axum = "0.7" # hook HTTP 서버 + ctl control 서버
portable-pty = "0.8" # latest stable. wezterm PTY
parking_lot = "0.12" # 세션 계층 뮤텍스 — poisoning 없음(패닉 1회가 세션 관리를 앱 재시작까지 벽돌로 만드는 케스케이드 차단)
uuid = { version = "1", features = ["v4"] } # sessionId/notification id
sha1_smol = "1" # dedupKey(순수 Rust, 추가 트랜지티브 의존 없음)
sha2 = "0.10" # Claude Code 스코프 Keychain 서비스명(CLAUDE_CONFIG_DIR sha256 앞 8자). 이미 Cargo.lock에 트랜지티브로 존재.
base64 = "0.22" # 초상 PNG base64 IPC 왕복 디코드/인코드
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
    "json",
] } # 요약기(Anthropic/OpenRouter/Gemini)·Claude 사용량 조회·로컬 hook/ctl HTTP(async).
# 루트 CA는 webpki(번들) + OS 스토어(native) 둘 다 신뢰한다. 예전엔 "rustls-tls"
# (=webpki 번들 전용)라서, 사내 MITM 프록시나 self-signed 루트를 OS에 설치한
# 환경에서는 앱만 TLS 핸드셰이크에 실패하고 claude CLI·curl은 멀쩡히 통하는
# 비대칭이 생겼다(사용량 실시간 조회가 network_error로 죽는 주된 원인).
tauri-plugin-dialog = "2" # 프로필 시작 폴더의 네이티브 폴더 선택 다이얼로그 (Rust 측에서만 호출 — capability 불필요)
tauri-plugin-notification = "2" # 앱 백그라운드 시 OS 데스크탑 알림(이슈 #39). 프런트 @tauri-apps/plugin-notification 로 호출 — capability 필요
tauri-plugin-opener = "2" # Markdown 미리보기의 외부 URL·로컬 미디어를 OS 기본 앱으로 연다.
ignore = "0.4" # 마크다운 파일 스캔(markdown.rs) — .gitignore/숨김 존중하는 WalkBuilder
# UI 언어 해석(crate::i18n)의 OS 로케일 조회. 초경량 — 트랜지티브 의존이 없다
# (플랫폼 API 직접 호출). 번역 카탈로그는 프런트에만 있으므로 i18n crate는 쓰지 않는다.
sys-locale = "0.3"
tauri-plugin-window-state = "2" # main 창 크기·위치·최대화 상태 저장/복원. Rust 측에서만 등록·호출 — capability 불필요
# Antigravity CLI(agy) 세션 사용량(kbm #2se): `~/.gemini/antigravity-cli/conversations/<id>.db`
# (SQLite, agy가 열어둔 채 읽어야 함)를 읽기 전용으로 연다. macOS/Linux는 시스템
# libsqlite3(SDK에 항상 있음)에 링크하고, Windows만 bundled로 정적 링크한다 —
# Windows 개발 머신에 시스템 sqlite3 개발 라이브러리가 보통 없기 때문.
rusqlite = { version = "0.31" }
tempfile = "3" # iTerm AppleScript를 컴파일할 실행 중 임시 파일
tauri-plugin-single-instance = "2" # 같은 identifier(=같은 app_data)의 두 번째 GUI 인스턴스를 막고 기존 창을 띄운다. Rust 측에서만 등록 — capability 불필요

# 세션 핸드오프(unix 전용, docs/session-handoff-design.md): poll 기반 인터럽트
# 가능 리더, sessiond와의 UDS+SCM_RIGHTS(fd 전달), TIOCSWINSZ/killpg.
# portable-pty 0.8이 이미 nix 0.25를 unix 구현에 쓰므로 같은 버전을 직접
# 의존에 명시해 락파일 상의 nix 인스턴스를 하나로 유지한다.
[target.'cfg(unix)'.dependencies]
nix = "0.25"
libc = "0.2" # TIOCSWINSZ ioctl(winsize) — portable-pty의 unix.rs와 동일한 저수준 호출

# es.exe stdout ANSI(예: CP949) 디코딩 — es v1.1.0.37은 stdout을 시스템
# ANSI 코드페이지로 출력하므로 UTF-8 lossy 디코딩 시 한글 경로가 깨진다.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }
# Windows 개발 머신엔 보통 시스템 sqlite3 개발 라이브러리가 없어 bundled로 정적 링크한다.
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "test-util",
] }
