<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Agent Office</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --line: #e2ded6;
  --accent: #3b6ef5; --ok: #1f9d55; --warn: #d98a00; --bad: #d1453b; --idle: #8a857c;
  --chip: #efece6; --user: #e8efff; --code: #f6f4f0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --panel: #1d1c1a; --ink: #ecebe7; --muted: #a29d93; --line: #302e2a;
    --accent: #7c9cff; --ok: #3fc27a; --warn: #f0a92a; --bad: #f06a5f; --idle: #8a857c;
    --chip: #2a2825; --user: #1f2a44; --code: #24221f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; padding-top: max(10px, env(safe-area-inset-top)); }
.bar h1 { font-size: 16px; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar.office { font-size: 22px; background: color-mix(in srgb, var(--accent) 16%, var(--chip)); }
.card.office { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.note { margin-top: 8px; font-size: 13px; color: var(--muted); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
.dot.on { background: var(--ok); }
.dot.off { background: var(--bad); }
nav { display: flex; gap: 4px; padding: 0 12px 8px; overflow-x: auto; }
nav button { flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 14px; }
nav button.active { background: var(--ink); color: var(--bg); }
main { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 10px; background: var(--chip); flex: 0 0 auto; display: grid; place-items: center; font-weight: 700; color: var(--muted); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.name { font-weight: 650; }
.sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.working { color: var(--ok); }
.chip.human { color: var(--warn); }
.chip.idle { color: var(--accent); }
.chip.off { color: var(--idle); }
.chip.bad { color: var(--bad); }
.working::before { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.wait { margin-top: 8px; font-size: 13px; background: color-mix(in srgb, var(--warn) 14%, transparent); border-radius: 8px; padding: 6px 8px; }
.goal { margin-top: 6px; font-size: 13px; }
.clickable { cursor: pointer; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
button.b { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: 13px; }
button.b:disabled { opacity: .45; }
button.b.primary { background: var(--accent); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); }
button.b.confirm { background: var(--bad); color: #fff; border-color: transparent; }
.back { border: 0; background: transparent; color: var(--accent); font: inherit; padding: 0 0 8px; }
.log { margin-top: 10px; }
.msg { margin: 8px 0; padding: 8px 10px; border-radius: 10px; }
.msg-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.user { background: var(--user); margin-left: 24px; }
.msg.assistant { background: var(--panel); border: 1px solid var(--line); margin-right: 12px; }
.msg.side { opacity: .75; font-size: 13px; }
.tool { margin: 4px 0 4px 8px; font-size: 13px; color: var(--muted); }
.tool summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; list-style: none; }
.tool summary::-webkit-details-marker { display: none; }
.tool summary::before { content: "▸ "; }
.tool[open] summary::before { content: "▾ "; }
.tool.err summary { color: var(--bad); }
.blk > .tool ~ .tool { margin-left: 24px; }
.text-block { margin-top: 4px; padding: 6px 8px; background: var(--code); border-radius: 8px; }
.text-block pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, Menlo, monospace; max-height: 50vh; overflow: auto; }
.content-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.content-actions button.b { min-height: 36px; padding: 5px 10px; max-width: 100%; overflow-wrap: anywhere; cursor: pointer; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.toast { position: fixed; z-index: 30; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: .95; }
input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
textarea { min-height: 90px; resize: vertical; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
.inline { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; }
.inline input { width: auto; }
h2 { font-size: 14px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.meter { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter > div { height: 100%; background: var(--accent); }
.meter.hot > div { background: var(--warn); }
.meter.full > div { background: var(--bad); }
.utt { margin: 8px 0; }
.utt .who { font-size: 12px; color: var(--muted); }
.utt .t { white-space: pre-wrap; word-break: break-word; }
.login { max-width: 420px; margin: 18vh auto; text-align: center; }
.login p { color: var(--muted); }
.scrolltop { position: fixed; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); border-radius: 999px; padding: 8px 12px; display: none; }
.chips { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
.chip.cli { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.warn { margin-top: 8px; font-size: 13px; background: color-mix(in srgb, var(--bad) 12%, transparent); border-radius: 8px; padding: 6px 8px; }
.taskform h3 { font-size: 14px; margin: 0 0 4px; }
.imgwrap { margin: 6px 0 6px 8px; }
.imgwrap.user { margin-left: 24px; }
.shot-open { display: block; max-width: 100%; padding: 0; border: 0; background: none; border-radius: 8px; cursor: zoom-in; }
.shot { display: block; max-width: 100%; max-height: 320px; border-radius: 8px; border: 1px solid var(--line); background: var(--code); }
.shot.side { max-height: 200px; opacity: .85; }
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .88); display: grid; grid-template: minmax(0, 1fr) / minmax(0, 1fr); place-items: center; padding: max(8px, env(safe-area-inset-top)) 8px max(8px, env(safe-area-inset-bottom)); cursor: zoom-out; }
.lb-content { display: flex; flex-direction: column; align-items: center; max-width: 100%; max-height: 100%; }
.lb img { max-width: 100%; min-height: 0; object-fit: contain; }
.lb .content-actions { flex-shrink: 0; justify-content: center; }
.card.ask { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.ask .q { margin-top: 10px; }
.ask .qt { font-weight: 600; margin: 4px 0 6px; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
button.b.opt { text-align: left; padding: 8px 10px; }
button.b.opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--panel)); }
.opt-d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.ask .text-block pre { max-height: 40vh; }
/* 하단 사용량 바: 어느 화면이든 늘 보인다. 누르면 사용량 탭. */
body { padding-bottom: calc(44px + env(safe-area-inset-bottom)); }
#usagebar { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; overflow-x: auto; padding: 7px 12px calc(7px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; scrollbar-width: none; }
#usagebar::-webkit-scrollbar { display: none; }
#usagebar:empty { display: none; }
.ub-p { display: inline-flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.ub-p b { color: var(--ink); font-weight: 650; }
.ub-w { display: inline-flex; align-items: center; gap: 3px; }
.ub-m { width: 16px; height: 5px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.ub-m > i { display: block; height: 100%; background: var(--accent); }
.ub-w.hot .ub-m > i { background: var(--warn); } .ub-w.hot { color: var(--warn); }
.ub-w.full .ub-m > i { background: var(--bad); } .ub-w.full { color: var(--bad); }
.toast { bottom: calc(56px + env(safe-area-inset-bottom)); }
.scrolltop { bottom: calc(56px + env(safe-area-inset-bottom)); }
/* 대화 로그 맨 위(최신)의 지금 상태: 생각 중은 점이 움직이고, 멈춤·입력 대기는 멈춘 표식. */
.live { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; font-size: 13px; color: var(--muted); }
.live:empty { display: none; }
.cost { margin: 6px 0 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cost:empty { display: none; }
.live.thinking { color: var(--ok); }
.live.stalled, .live.human { color: var(--warn); }
.live-dots { display: inline-flex; gap: 3px; }
.live-dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: bounce 1.2s infinite ease-in-out; }
.live-dots i:nth-child(2) { animation-delay: .15s; } .live-dots i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
@media (prefers-reduced-motion: reduce) { .live-dots i { animation: pulse 1.6s infinite; } }
.live-mark { width: 8px; height: 8px; border-radius: 2px; border: 2px solid currentColor; }
.live.stalled .live-mark { background: currentColor; }
.chip.stalled { color: var(--warn); }
/* 직접 입력과 보낼 대기열. */
.msgform h3 { font-size: 14px; margin: 0 0 4px; }
.msgform textarea { min-height: 64px; }
.queue { margin-top: 8px; }
.queue:empty { display: none; }
.q-title { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.q-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.q-n { flex: 0 0 auto; min-width: 20px; text-align: center; font-size: 12px; color: var(--muted); background: var(--chip); border-radius: 999px; }
.q-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.q-item button.b { padding: 4px 9px; }
.q-err { margin-top: 6px; font-size: 13px; color: var(--warn); }
details.taskform > summary { cursor: pointer; list-style: none; font-weight: 600; font-size: 14px; }
details.taskform > summary::-webkit-details-marker { display: none; }
details.taskform > summary::before { content: "▸ "; color: var(--muted); }
details.taskform[open] > summary::before { content: "▾ "; }
details.taskform > summary .sub { display: inline; font-weight: 400; margin-left: 6px; }
</style>
</head>
<body>
<header>
  <div class="bar"><span id="dot" class="dot"></span><h1 id="title">Agent Office</h1><span id="ver" class="sub"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<button id="up" class="b scrolltop">↑</button>
<div id="toast" class="toast" role="status"></div>
<footer id="usagebar" role="button" tabindex="0"></footer>

  document.getElementById("ver").textContent = (host ? "Agent Office " : "") + "v" + app;
  document.title = host ? `${host} · Agent Office` : "Agent Office";
}
/** 로그를 받아 쌓는다. "same"(새 항목 없음)·"append"(같은 세션에 이어짐)·"reset"(처음·새 세션). */
async function refreshLog(agentId) {
  const prev = logs.get(agentId);
  const q = prev ? `?after=${prev.last}&epoch=${prev.epoch}` : "";
  const d = await api(`/log/${encodeURIComponent(agentId)}${q}`);
  if (prev && prev.epoch === d.epoch) {
    if (!d.items.length && prev.attached === d.attached) return "same";
    const attachedChanged = prev.attached !== d.attached;
    prev.items.push(...d.items);
    if (prev.items.length > LOG_KEEP) prev.items.splice(0, prev.items.length - LOG_KEEP);
    prev.last = d.last; prev.attached = d.attached;
    return attachedChanged ? "reset" : "append";
  }
  // 새 세션(epoch가 바뀜)이면 이전 세션 대화는 버린다.
  logs.set(agentId, d);
  return "reset";
}
let busy = false;
async function tick() {
  if (busy || !token || unauthorized || document.hidden) return;
  busy = true;
  try {
    let changed = false;
    // 사용량 바는 어느 탭에서든 갱신한다. 실패해도 다른 갱신은 이어 간다.
    const usageChanged = await refreshUsage().catch(() => false);
    if (view.tab === "chars" || hostShown == null) changed = await refreshChars();
    if (view.tab === "chars" && view.agent) {
      const agentId = view.agent;
      // 보지 않는 캐릭터의 로그는 들고 있지 않는다.
      for (const k of [...logs.keys()]) if (k !== agentId) logs.delete(k);
      const logMode = await refreshLog(agentId);
      // 업무 목록을 못 받아도 상태·로그 갱신은 이어 간다. 일반 에이전트는 보낸 업무가 없다.
      if (agentId !== OFFICE) tasksData = await api("/tasks").catch(() => tasksData);
      if (view.agent === agentId) { updateAgentView(changed, logMode); refreshSent(); }
    } else if (view.tab === "talks") {
      if (view.talk) {
        const d = await api(`/discussions/${encodeURIComponent(view.talk)}`);
        if (!talkDetail || JSON.stringify(d) !== JSON.stringify(talkDetail)) {
          const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
          talkDetail = d; if (!typing) render();
        }
      } else {
        const d = await api("/discussions");
        if (JSON.stringify(d) !== JSON.stringify(talksData)) { talksData = d; render(); }
      }
    } else if (view.tab === "usage") {
      if (usageChanged) render();
    } else if (changed) render();
  } catch (e) {
    if (!unauthorized) console.warn(e);
  } finally { busy = false; }
}
/**
 * 캐릭터 화면은 통째로 다시 그리지 않는다 — 쓰고 있는 업무 입력과 펼쳐 둔 도구 블록이 사라지기 때문이다.
 * 상태가 바뀌면 머리 카드와 보내기 버튼만, 로그는 새 항목만 맨 위에 붙인다.
 */
function updateAgentView(changed, logMode) {
  const c = currentChar();
  const head = document.getElementById("head");
  if (!c || !head || !document.getElementById("taskform")) { if (changed || logMode !== "same") render(); return; }
  if (changed) { head.replaceWith(renderHead(c)); refreshTaskActions(); }
  refreshAsks();
  refreshMsg();
  refreshLive();
  refreshCost();
  if (logMode === "reset") { document.getElementById("log").replaceWith(renderLog(c.agentId)); markLog(); }
  else if (logMode === "append") prependLog(c.agentId);
}
function markLog() {
  const box = document.getElementById("log");
  const log = view.agent && logs.get(view.agent);
  if (box && log) box.dataset.last = String(log.last);
}
function prependLog(agentId) {
  const box = document.getElementById("log");
  const log = logs.get(agentId);
  if (!box || !log) return;
  if (!box.dataset.last || box.querySelector(".empty")) { box.replaceWith(renderLog(agentId)); markLog(); return; }
  const shown = Number(box.dataset.last);
  for (const it of log.items) if (it.seq > shown) placeItem(box, it);
  while (box.childElementCount > LOG_KEEP) box.lastElementChild.remove();
  box.dataset.last = String(log.last);
}
function updateUp() {
  document.getElementById("up").style.display = view.tab === "chars" && view.agent && window.scrollY > 600 ? "block" : "none";
}
document.getElementById("up").onclick = () => window.scrollTo(0, 0);
window.addEventListener("scroll", updateUp, { passive: true });
function refreshNow() { setTimeout(tick, 0); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshNow(); });
setInterval(tick, 2500);
render();
refreshNow();
</script>
</body>
