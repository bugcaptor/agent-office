<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Agent Office</title>
<style>
:root {
  --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1c1a; --muted: #6b675f; --line: #e2ded6;
  --accent: #3b6ef5; --ok: #1f9d55; --warn: #d98a00; --bad: #d1453b; --idle: #8a857c;
  --chip: #efece6; --user: #e8efff; --code: #f6f4f0;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141412; --panel: #1d1c1a; --ink: #ecebe7; --muted: #a29d93; --line: #302e2a;
    --accent: #7c9cff; --ok: #3fc27a; --warn: #f0a92a; --bad: #f06a5f; --idle: #8a857c;
    --chip: #2a2825; --user: #1f2a44; --code: #24221f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: env(safe-area-inset-bottom); }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 16px 6px; padding-top: max(10px, env(safe-area-inset-top)); }
.bar h1 { font-size: 16px; margin: 0; flex: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--idle); }
.dot.on { background: var(--ok); }
.dot.off { background: var(--bad); }
nav { display: flex; gap: 4px; padding: 0 12px 8px; overflow-x: auto; }
nav button { flex: 0 0 auto; border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 14px; }
nav button.active { background: var(--ink); color: var(--bg); }
main { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.row { display: flex; gap: 10px; align-items: center; }
.grow { flex: 1; min-width: 0; }
.avatar { width: 44px; height: 44px; border-radius: 10px; background: var(--chip); flex: 0 0 auto; display: grid; place-items: center; font-weight: 700; color: var(--muted); overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.name { font-weight: 650; }
.sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.working { color: var(--ok); }
.chip.human { color: var(--warn); }
.chip.idle { color: var(--accent); }
.chip.off { color: var(--idle); }
.chip.bad { color: var(--bad); }
.working::before { animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.wait { margin-top: 8px; font-size: 13px; background: color-mix(in srgb, var(--warn) 14%, transparent); border-radius: 8px; padding: 6px 8px; }
.goal { margin-top: 6px; font-size: 13px; }
.clickable { cursor: pointer; }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
button.b { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 11px; font: inherit; font-size: 13px; }
button.b:disabled { opacity: .45; }
button.b.primary { background: var(--accent); color: #fff; border-color: transparent; }
button.b.danger { color: var(--bad); }
button.b.confirm { background: var(--bad); color: #fff; border-color: transparent; }
.back { border: 0; background: transparent; color: var(--accent); font: inherit; padding: 0 0 8px; }
.log { margin-top: 10px; }
.msg { margin: 8px 0; padding: 8px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
.msg.user { background: var(--user); margin-left: 24px; }
.msg.assistant { background: var(--panel); border: 1px solid var(--line); margin-right: 12px; }
.msg.side { opacity: .75; font-size: 13px; }
.tool { margin: 4px 0 4px 8px; font-size: 13px; color: var(--muted); }
.tool summary { cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; list-style: none; }
.tool summary::-webkit-details-marker { display: none; }
.tool summary::before { content: "▸ "; }
.tool[open] summary::before { content: "▾ "; }
.tool.err summary { color: var(--bad); }
.tool pre { margin: 4px 0 0; padding: 8px; background: var(--code); border-radius: 8px; white-space: pre-wrap; word-break: break-word; font: 12px/1.4 ui-monospace, Menlo, monospace; max-height: 50vh; overflow: auto; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: .95; }
input, textarea, select { width: 100%; font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
textarea { min-height: 90px; resize: vertical; }
label.f { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
.inline { display: flex; gap: 8px; align-items: center; margin-top: 8px; font-size: 14px; }
.inline input { width: auto; }
h2 { font-size: 14px; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.meter { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.meter > div { height: 100%; background: var(--accent); }
.meter.hot > div { background: var(--warn); }
.meter.full > div { background: var(--bad); }
.utt { margin: 8px 0; }
.utt .who { font-size: 12px; color: var(--muted); }
.utt .t { white-space: pre-wrap; word-break: break-word; }
.login { max-width: 420px; margin: 18vh auto; text-align: center; }
.login p { color: var(--muted); }
.scrolltop { position: fixed; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom)); border-radius: 999px; padding: 8px 12px; display: none; }
.chips { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: 0 0 auto; }
.chip.cli { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.warn { margin-top: 8px; font-size: 13px; background: color-mix(in srgb, var(--bad) 12%, transparent); border-radius: 8px; padding: 6px 8px; }
.taskform h3 { font-size: 14px; margin: 0 0 4px; }
</style>
</head>
<body>
<header>
  <div class="bar"><span id="dot" class="dot"></span><h1 id="title">Agent Office</h1><span id="ver" class="sub"></span></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<button id="up" class="b scrolltop">↑</button>
<div id="toast" class="toast"></div>
<script>

const S = {

    clockedOut: "퇴근", back: "← 목록", log: "대화 로그", noLog: "이 터미널에는 읽을 대화 로그가 없습니다(Claude·Codex 전사가 없는 세션).", noItems: "아직 대화가 없습니다.",
    restart: "터미널 재시작", resume: "이어하기", terminate: "종료", interrupt: "작업 중단(Esc)", ctrlc: "Ctrl-C", launchClaude: "Claude 실행", launchCodex: "Codex 실행",

  },
  en: {
    tabs: { chars: "Characters", talks: "Discussions", usage: "Usage" },
    phase: { working: "Working", "needs-human": "Waiting for answer", idle: "Waiting for input", ended: "Ended", starting: "Starting", off: "Off", running: "On" },
    clockedOut: "Clocked out", back: "← List", log: "Conversation", noLog: "No conversation log for this terminal (no Claude/Codex transcript).", noItems: "No messages yet.",
    restart: "Restart terminal", resume: "Resume", terminate: "Terminate", interrupt: "Interrupt (Esc)", ctrlc: "Ctrl-C", launchClaude: "Run Claude", launchCodex: "Run Codex",
    again: "Tap again to confirm", done: "Sent", result: "Result", lines: "lines",
    sendTask: "Send a task", titlePh: "Task (title)", bodyPh: "Details (optional)", cli: "CLI", send: "Send", restartSend: "Restart and send",
    cliRunning: (n) => `${n} running`, cliBusy: "A command is running in the terminal", restartNeeded: "This terminal must restart to receive the task",
    restartWarn: (what) => `${what}. Sending restarts the terminal, so the current session ends.`,
    talkState: { pending: "Pending", ready: "Ready", running: "Running", waiting_user: "Waiting for you", wrapping_up: "Wrapping up", review: "Review", finished: "Finished", paused: "Paused", "waiting-usage": "Waiting for usage" },
    start: "Start", answer: "Answer", answerPh: "Your answer to the moderator", noTalks: "No discussions.", question: "Moderator question",
    win: { session: "5 hours", weekly: "Weekly", session_model: "5 hours", weekly_model: "Weekly", monthly: "Monthly", unknown: "Other" },
    usageNone: "No usage data.", resets: "resets", login: "No access token", loginHelp: "Copy the address from the app: Settings › Control › Web dashboard, and open it on this device.",
    unauthorized: "Token rejected. Get a fresh address from the app.", offline: "Cannot reach the app",
    err: { "not-running": "Terminal is not running", "not-at-shell-prompt": "Not at a shell prompt (CLI running or input pending)", "human-input-pending": "Unsent input is pending in the app", "renderer-unavailable": "App window is not responding", "busy": "Another input is in progress", "shell-unsupported": "Unsupported shell", "empty": "Empty",
      "restart-required": "A CLI is running in the terminal. Confirm the restart warning and send again", "work-send-busy": "A task is already being sent to this character", "work-send-clocked-out": "This character has clocked out", "work-send-auto-run": "This character is running an auto-run", "work-send-profile-unsupported": "Characters with a startup command can't receive tasks", "work-not-loaded": "The app hasn't loaded tasks yet" },
  },

document.documentElement.lang = L;

// ── 토큰 ──
const TOKEN_KEY = "agent-office-web-dash-token";
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
let token = null;
{
  const m = location.hash.match(/(?:^#|&)t=([0-9a-f]+)/);
  if (m) { token = m[1]; store(TOKEN_KEY, token); history.replaceState(null, "", location.pathname); }
  else token = load(TOKEN_KEY);
}

// ── 도우미 ──
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "text") n.textContent = v;
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
function errText(e) { return S.err[e] || e; }
let toastTimer;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}
function setDot(cls) { document.getElementById("dot").className = "dot " + cls; }
async function api(path, opts = {}) {
  const res = await fetch("/api" + path, {
    method: opts.method || "GET",
    headers: { "Authorization": "Bearer " + token, ...(opts.body ? { "Content-Type": "application/json" } : {}) },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    cache: "no-store",
  }).catch(() => null);
  if (!res) { setDot("off"); throw new Error(S.offline); }
  if (res.status === 401) { setDot("off"); unauthorized = true; render(); throw new Error(S.unauthorized); }
  setDot("on");
  const j = await res.json();
  if (!j.ok) { const err = new Error(errText(j.error)); err.code = j.error; throw err; }
  return j.data;
}
async function act(path, body) {
  try { await api(path, { method: "POST", body: body || {} }); toast(S.done); setTimeout(refreshNow, 400); return true; }
  catch (e) { toast(e.message); return false; }
}
/** 위험한 버튼: 처음 누르면 확인 상태가 되고 3초 안에 다시 눌러야 실행한다. */
function confirmBtn(label, run, cls = "b danger") {
  const b = el("button", { class: cls, text: label });
  let armed = null;
  b.addEventListener("click", () => {
    if (armed) { clearTimeout(armed); armed = null; b.className = cls; b.textContent = label; run(); return; }

    armed = setTimeout(() => { armed = null; b.className = cls; b.textContent = label; }, 3000);
  });
  return b;
}
function fmtTime(ms) {
  if (!ms) return "";
  const d = new Date(ms);
  return d.toLocaleString(L === "ko" ? "ko-KR" : undefined, { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

// ── 상태 ──
const view = { tab: S.tabs[load("agent-office-web-dash-tab")] ? load("agent-office-web-dash-tab") : "chars", agent: null, talk: null };
let unauthorized = false;
let chars = null, charsRev = null;
let talksData = null, talkDetail = null, usageData = null;
const logs = new Map(); // agentId -> {epoch,last,attached,items}

function phaseOf(c) {
  if (c.clockedOut) return ["off", S.clockedOut];
  if (!c.session) return ["off", S.phase.off];
  if (c.session.state === "starting") return ["idle", S.phase.starting];
  if (c.session.state !== "running") return ["off", S.phase.ended];
  if (c.waiting && c.waiting.some((w) => w.source === "hook")) return ["human", S.phase["needs-human"]];
  const p = c.turn && c.turn.phase;
  if (p === "working") return ["working", S.phase.working];
  if (p === "needs-human") return ["human", S.phase["needs-human"]];
  if (p === "idle") return ["idle", S.phase.idle];
  return ["idle", S.phase.running];
}
function waitingMessage(c) {
  const hook = (c.waiting || []).filter((w) => w.source === "hook").pop();
  if (hook && hook.message) return hook.message;
  if (c.turn && c.turn.phase === "needs-human" && c.turn.message) return c.turn.message;
  return null;
}
function avatar(c) {
  const box = el("div", { class: "avatar" }, (c.name || "?").slice(0, 1));

    const img = el("img", { alt: "", src: `/api/portrait/${encodeURIComponent(c.agentId)}?t=${token}&v=${c.portrait}` });

  }
  return box;
}
function goalOf(c) {
  const l = c.label || {};
  return l.goal || null;
}
function cwdOf(c) { return (c.label && c.label.cwd) || c.cwd || ""; }
/** 경로의 말단 폴더 이름(`/a/b/app/` → `app`). */

  const parts = (path || "").split(/[\\/]+/).filter(Boolean);

}

  return [leaf(cwdOf(c)), branch && "⎇ " + branch].filter(Boolean).join(" ");
}
const CLI_NAMES = { claude: "Claude", codex: "Codex" };
/** 터미널에서 CLI(또는 다른 명령)가 돌고 있어 보내기가 터미널 재시작을 부르는가. */

  const [cls, label] = phaseOf(c);

    el("span", { class: "chip " + cls, text: label }),
    c.cli && c.session && c.session.state === "running" && el("span", { class: "chip cli working", text: S.cliRunning(CLI_NAMES[c.cli] || c.cli) }));

// ── 화면 ──
function renderNav() {
  const nav = document.getElementById("nav");
  nav.replaceChildren(...Object.entries(S.tabs).map(([k, label]) =>
    el("button", { class: view.tab === k ? "active" : "", text: label, onclick: () => { view.tab = k; view.agent = null; view.talk = null; store("agent-office-web-dash-tab", k); render(); refreshNow(); } })));
}
function render() {
  const main = document.getElementById("main");
  if (!token || unauthorized) {

}
function renderChars() {
  if (!chars) return [el("div", { class: "empty", text: "…" })];

    const [cls] = phaseOf(c);
    const wait = cls === "human" ? waitingMessage(c) : null;
    const goal = goalOf(c);
    return el("div", { class: "card clickable", onclick: () => { view.agent = c.agentId; render(); refreshNow(); window.scrollTo(0, 0); } },
      el("div", { class: "row" }, avatar(c),
        el("div", { class: "grow" }, el("div", { class: "name", text: c.name }), el("div", { class: "sub", title: cwdOf(c), text: [c.role, placeOf(c)].filter(Boolean).join(" · ") })),
        chips(c)),

      wait && el("div", { class: "wait", text: wait }));
  });
}
function renderAgent() {
  const back = el("button", { class: "back", text: S.back, onclick: () => { view.agent = null; render(); } });
  const c = (chars || []).find((x) => x.agentId === view.agent);
  if (!c) return [back];
  return [back, renderHead(c), renderTaskForm(c), renderLog(c.agentId)];
}
function renderHead(c) {
  const [cls] = phaseOf(c);
  const running = c.session && c.session.state === "running";
  const id = encodeURIComponent(c.agentId);
  const wait = cls === "human" ? waitingMessage(c) : null;
  return el("div", { class: "card", id: "head" },
    el("div", { class: "row" }, avatar(c),
      el("div", { class: "grow" }, el("div", { class: "name", text: c.name }), el("div", { class: "sub", title: cwdOf(c), text: placeOf(c) })),
      chips(c)),
    goalOf(c) && el("div", { class: "goal", text: goalOf(c) }),
    wait && el("div", { class: "wait", text: wait }),
    el("div", { class: "btns" },
      el("button", { class: "b", disabled: !running, text: S.interrupt, onclick: () => act(`/agents/${id}/interrupt`) }),
      el("button", { class: "b", disabled: !running, text: S.ctrlc, onclick: () => act(`/agents/${id}/ctrl-c`) }),
      el("button", { class: "b", disabled: !running || busyShell(c), text: S.launchClaude, onclick: () => act(`/agents/${id}/launch`, { cli: "claude" }) }),
      el("button", { class: "b", disabled: !running || busyShell(c), text: S.launchCodex, onclick: () => act(`/agents/${id}/launch`, { cli: "codex" }) })),
    el("div", { class: "btns" },
      confirmBtn(S.restart, () => act(`/agents/${id}/restart`), "b"),
      confirmBtn(S.resume, () => act(`/agents/${id}/resume`), "b"),
      running && confirmBtn(S.terminate, () => act(`/agents/${id}/terminate`))));
}

// ── 캐릭터별 업무 보내기 ──
// 터미널에 CLI가 돌고 있으면 보내기는 터미널을 재시작해 새 세션으로 보낸다. 웹에서 경고를 보이고
// 확인을 받은 뒤에만 `restart: true`로 보낸다(앱 확인창은 띄우지 않는다).
const drafts = new Map(); // agentId -> {title, body, cli, needRestart, sending}
function draftOf(c) {
  let d = drafts.get(c.agentId);
  if (!d) { d = { title: "", body: "", cli: c.cli || c.defaultCli || "claude", needRestart: false, sending: false }; drafts.set(c.agentId, d); }
  return d;
}
function renderTaskForm(c) {
  const d = draftOf(c);
  const cli = el("select", { onchange: (e) => { d.cli = e.target.value; } },
    ...["claude", "codex"].map((v) => el("option", { value: v, text: CLI_NAMES[v], selected: d.cli === v })));
  return el("div", { class: "card taskform", id: "taskform" },
    el("h3", { text: S.sendTask }),
    el("input", { value: d.title, placeholder: S.titlePh, oninput: (e) => { d.title = e.target.value; } }),
    el("textarea", { placeholder: S.bodyPh, style: "margin-top:6px", oninput: (e) => { d.body = e.target.value; } }, d.body),
    el("div", { class: "row", style: "margin-top:6px" }, el("label", { class: "sub", text: S.cli }), el("div", { style: "width:130px" }, cli)),
    renderTaskActions(c));
}
function renderTaskActions(c) {
  const d = draftOf(c);
  const restart = d.needRestart || busyShell(c);
  const what = c.cli ? S.cliRunning(CLI_NAMES[c.cli] || c.cli) : busyShell(c) ? S.cliBusy : S.restartNeeded;
  const key = JSON.stringify([restart, what, d.sending]);
  const submit = async () => {
    if (d.sending) return;
    if (!d.title.trim() && !d.body.trim()) { toast(errText("empty")); return; }
    d.sending = true; refreshTaskActions();
    try {
      await api("/tasks", { method: "POST", body: { title: d.title, body: d.body, assigneeAgentId: c.agentId, cli: d.cli, send: true, restart } });
      toast(S.done);
      drafts.delete(c.agentId);
      const form = document.getElementById("taskform");
      if (form) form.replaceWith(renderTaskForm(c));
      setTimeout(refreshNow, 400);
    } catch (e) {
      if (e.code === "restart-required") d.needRestart = true;
      toast(e.message);
    } finally { d.sending = false; refreshTaskActions(); }
  };
  return el("div", { id: "taskact", "data-key": key },
    restart && el("div", { class: "warn", text: "⚠ " + S.restartWarn(what) }),
    el("div", { class: "btns" }, restart
      ? confirmBtn(S.restartSend, submit, "b danger")
      : el("button", { class: "b primary", disabled: d.sending, text: S.send, onclick: submit })));
}
/** 보내기 버튼 줄을 다시 그린다. 모양이 같으면 그대로 둔다 — 두 번 눌러 확인하는 중에 상태 갱신이 확인을 풀지 않게. */
function refreshTaskActions() {
  const c = (chars || []).find((x) => x.agentId === view.agent);
  const box = document.getElementById("taskact");
  if (!c || !box) return;
  const next = renderTaskActions(c);
  if (next.dataset.key !== box.dataset.key) box.replaceWith(next);
}
function firstLine(text, max = 90) {
  const line = (text || "").split("\n").find((l) => l.trim()) || "";
  return line.length > max ? line.slice(0, max) + "…" : line;
}
function renderLog(agentId) {
  const box = el("div", { class: "log", id: "log" });
  const log = logs.get(agentId);
  if (!log) { box.append(el("div", { class: "empty", text: "…" })); return box; }
  if (!log.attached) { box.append(el("div", { class: "empty", text: S.noLog })); return box; }
  if (!log.items.length) { box.append(el("div", { class: "empty", text: S.noItems })); return box; }
  // 최신이 위로 온다.
  for (let i = log.items.length - 1; i >= 0; i--) box.append(renderItem(log.items[i]));
  return box;
}
function renderItem(it) {
  const side = it.sidechain ? " side" : "";
  if (it.kind === "text") return el("div", { class: "msg " + it.role + side, text: it.text });
  if (it.kind === "tool_use") {
    const head = (it.toolName ? it.toolName + ": " : "⤷ ") + firstLine(it.text);
    if (!it.toolName) return el("div", { class: "tool" + side, text: head });
    return el("details", { class: "tool" + side }, el("summary", { text: "🔧 " + head }), el("pre", { text: it.text }));
  }
  const n = (it.text || "").split("\n").length;
  return el("details", { class: "tool" + (it.isError ? " err" : "") + side },
    el("summary", { text: `↳ ${S.result} · ${n}${L === "ko" ? "" : " "}${S.lines} · ${firstLine(it.text, 60)}` }), el("pre", { text: it.text }));
}

function renderTalks() {
  if (view.talk) return renderTalk();
  if (!talksData) return [el("div", { class: "empty", text: "…" })];
  if (!talksData.length) return [el("div", { class: "empty", text: S.noTalks })];
  const rows = [...talksData].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  return rows.map((d) => el("div", { class: "card clickable", onclick: () => { view.talk = d.id; talkDetail = null; render(); refreshNow(); } },
    el("div", { class: "row" }, el("div", { class: "grow" }, el("div", { class: "name", text: d.topic || d.id }), el("div", { class: "sub", text: fmtTime(d.updatedAt) })),
      el("span", { class: "chip " + talkCls(d.state), text: S.talkState[d.state] || d.state }))));
}
function talkCls(state) {
  return { running: "working", wrapping_up: "working", waiting_user: "human", ready: "idle", paused: "bad" }[state] || "off";
}
let answerDraft = "";
function renderTalk() {
  const back = el("button", { class: "back", text: S.back, onclick: () => { view.talk = null; render(); } });
  if (!talkDetail || talkDetail.status.id !== view.talk) return [back, el("div", { class: "empty", text: "…" })];
  const st = talkDetail.status;
  const id = encodeURIComponent(st.id);
  const head = el("div", { class: "card" },
    el("div", { class: "row" }, el("div", { class: "grow" }, el("div", { class: "name", text: st.topic })), el("span", { class: "chip " + talkCls(st.state), text: S.talkState[st.state] || st.state })),
    el("div", { class: "sub", text: (st.participants || []).map((p) => (p.moderator ? "🎤 " : "") + (p.name || p.agentId) + (p.speaking ? " 💬" : "")).join(", ") }),
    st.attention && st.attention.detail && el("div", { class: "wait", text: (st.state === "waiting_user" ? S.question + ": " : "") + st.attention.detail }),
    st.state === "ready" && el("div", { class: "btns" }, el("button", { class: "b primary", text: S.start, onclick: () => act(`/discussions/${id}/start`) })),
    st.state === "waiting_user" && el("div", null,
      el("textarea", { placeholder: S.answerPh, oninput: (e) => { answerDraft = e.target.value; } }, answerDraft),
      el("div", { class: "btns" }, el("button", { class: "b primary", text: S.answer, onclick: async () => { if (await act(`/discussions/${id}/answer`, { text: answerDraft })) { answerDraft = ""; } } }))));
  const utts = talkDetail.transcript.map((u) => el("div", { class: "utt card" },
    el("div", { class: "who", text: `R${u.round} · ${u.name || (u.agentId ? u.agentId : u.kind)} · ${fmtTime(u.at)}` }), el("div", { class: "t", text: u.text })));
  return [back, head, ...utts];
}

function renderUsage() {
  if (!usageData) return [el("div", { class: "empty", text: "…" })];
  const out = [];
  for (const key of ["claude", "codex", "opencode"]) {
    const p = usageData[key];
    if (!p || !p.windows || !p.windows.length) continue;
    out.push(el("h2", { text: key[0].toUpperCase() + key.slice(1) + (p.planLabel ? ` · ${p.planLabel}` : "") }));
    out.push(el("div", { class: "card" }, ...p.windows.map((w) => {
      const pct = Math.max(0, Math.min(100, Math.round(w.usedPercent)));
      return el("div", { style: "margin: 6px 0" },
        el("div", { class: "row" }, el("div", { class: "grow sub", text: [S.win[w.kind] || w.kind, w.label].filter(Boolean).join(" · ") }), el("div", { text: pct + "%" })),
        el("div", { class: "meter" + (pct >= 95 ? " full" : pct >= 75 ? " hot" : "") }, el("div", { style: `width:${pct}%` })),
        w.resetsAtMs && el("div", { class: "sub", text: `${S.resets} ${fmtTime(w.resetsAtMs)}` }));
    })));
  }
  return out.length ? out : [el("div", { class: "empty", text: S.usageNone })];
}

// ── 갱신 ──
const LOG_KEEP = 400;
async function refreshChars() {
  const d = await api("/state");
  document.getElementById("ver").textContent = "v" + d.app;
  if (d.rev === charsRev) return false;
  charsRev = d.rev; chars = d.characters;
  return true;
}
/** 로그를 받아 쌓는다. "same"(새 항목 없음)·"append"(같은 세션에 이어짐)·"reset"(처음·새 세션). */
async function refreshLog(agentId) {
  const prev = logs.get(agentId);
  const q = prev ? `?after=${prev.last}&epoch=${prev.epoch}` : "";
  const d = await api(`/log/${encodeURIComponent(agentId)}${q}`);
  if (prev && prev.epoch === d.epoch) {
    if (!d.items.length && prev.attached === d.attached) return "same";
    const attachedChanged = prev.attached !== d.attached;
    prev.items.push(...d.items);
    if (prev.items.length > LOG_KEEP) prev.items.splice(0, prev.items.length - LOG_KEEP);
    prev.last = d.last; prev.attached = d.attached;
    return attachedChanged ? "reset" : "append";
  }
  // 새 세션(epoch가 바뀜)이면 이전 세션 대화는 버린다.
  logs.set(agentId, d);
  return "reset";
}
let busy = false;
async function tick() {
  if (busy || !token || unauthorized || document.hidden) return;
  busy = true;
  try {
    let changed = false;
    if (view.tab === "chars") changed = await refreshChars();
    if (view.tab === "chars" && view.agent) {
      const agentId = view.agent;
      // 보지 않는 캐릭터의 로그는 들고 있지 않는다.
      for (const k of [...logs.keys()]) if (k !== agentId) logs.delete(k);
      const logMode = await refreshLog(agentId);
      if (view.agent === agentId) updateAgentView(changed, logMode);
    } else if (view.tab === "talks") {
      if (view.talk) {
        const d = await api(`/discussions/${encodeURIComponent(view.talk)}`);
        if (!talkDetail || JSON.stringify(d) !== JSON.stringify(talkDetail)) {
          const typing = document.activeElement && document.activeElement.tagName === "TEXTAREA";
          talkDetail = d; if (!typing) render();
        }
      } else {
        const d = await api("/discussions");
        if (JSON.stringify(d) !== JSON.stringify(talksData)) { talksData = d; render(); }
      }
    } else if (view.tab === "usage") {
      if (!usageData || Date.now() - (usageData._at || 0) > 60000) { usageData = await api("/usage"); usageData._at = Date.now(); render(); }
    } else if (changed) render();
  } catch (e) {
    if (!unauthorized) console.warn(e);
  } finally { busy = false; }
}
/**
 * 캐릭터 화면은 통째로 다시 그리지 않는다 — 쓰고 있는 업무 입력과 펼쳐 둔 도구 블록이 사라지기 때문이다.
 * 상태가 바뀌면 머리 카드와 보내기 버튼만, 로그는 새 항목만 맨 위에 붙인다.
 */
function updateAgentView(changed, logMode) {
  const c = (chars || []).find((x) => x.agentId === view.agent);
  const head = document.getElementById("head");
  if (!c || !head || !document.getElementById("taskform")) { if (changed || logMode !== "same") render(); return; }
  if (changed) { head.replaceWith(renderHead(c)); refreshTaskActions(); }
  if (logMode === "reset") { document.getElementById("log").replaceWith(renderLog(c.agentId)); markLog(); }
  else if (logMode === "append") prependLog(c.agentId);
}
function markLog() {
  const box = document.getElementById("log");
  const log = view.agent && logs.get(view.agent);
  if (box && log) box.dataset.last = String(log.last);
}
function prependLog(agentId) {
  const box = document.getElementById("log");
  const log = logs.get(agentId);
  if (!box || !log) return;
  if (!box.dataset.last || box.querySelector(".empty")) { box.replaceWith(renderLog(agentId)); markLog(); return; }
  const shown = Number(box.dataset.last);
  for (const it of log.items) if (it.seq > shown) box.prepend(renderItem(it));
  while (box.childElementCount > LOG_KEEP) box.lastElementChild.remove();
  box.dataset.last = String(log.last);
}
function updateUp() {
  document.getElementById("up").style.display = view.tab === "chars" && view.agent && window.scrollY > 600 ? "block" : "none";
}
document.getElementById("up").onclick = () => window.scrollTo(0, 0);
window.addEventListener("scroll", updateUp, { passive: true });
function refreshNow() { setTimeout(tick, 0); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshNow(); });
setInterval(tick, 2500);
render();
refreshNow();
</script>
