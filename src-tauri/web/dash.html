<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>Agent Office</title>
<script>
// 화면 테마(자동·밝게·어둡게)는 이 브라우저에 저장한다. 첫 그림 전에 붙여 깜빡이지 않게 한다.
try { const t = localStorage.getItem("agent-office-web-dash-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (_) {}
</script>
<link rel="stylesheet" href="/dash.css">
</head>
<body>
<header>
  <div class="bar"><span id="dot" class="dot"></span><h1 id="title">Agent Office</h1><span id="ver" class="sub"></span><button id="theme" class="themebtn" type="button"></button></div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<button id="up" class="b scrolltop">↑</button>
<div id="toast" class="toast" role="status"></div>
<footer id="usagebar" role="button" tabindex="0"></footer>
<script src="/dash.js"></script>
<script src="/tasks.js"></script>
<script src="/shell.js"></script>
<script src="/files.js"></script>
<script>window.Dash && window.Dash.boot();</script>
</body>
</html>
